[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snakepp"
version = "0.1.0"
description = "Version-aware retrieval-augmented coding assistant for Python"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typer>=0.12",
  "packaging>=23.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "lxml>=5.0",
  "docutils>=0.20",
  "rank-bm25>=0.2.2",
  "datasketch>=1.6",
  "tqdm>=4.66",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=2.7", "faiss-cpu>=1.8"]
gen = ["openai>=1.30", "anthropic>=0.30"]
demo = ["gradio>=4.0"]
analysis = ["matplotlib>=3.8", "jupyter>=1.0", "scipy>=1.11", "tabulate>=0.9"]
dev = ["pytest>=8.0", "ruff>=0.5", "uv>=0.4"]

[tool.setuptools.packages.find]
include = ["snakepp*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
